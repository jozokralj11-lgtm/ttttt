name: Build TouchLooper DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TouchLooper
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl fakeroot rsync \
            libarchive-tools libtinfo6 libncurses6

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build TouchLooper
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Find package
        run: |
          echo "Generated packages:"
          find . -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: TouchLooper-Sileo-DEB
          path: packages/*.deb
          if-no-files-found: error
